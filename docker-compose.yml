services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grademind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-grademind}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grademind} -d ${POSTGRES_DB:-grademind}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-grademind}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-grademind}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DEBUG: "${DEBUG:-False}"
      PROJECT_NAME: "GradeMIND Backend"
      PROJECT_VERSION: "1.0.0"
      # Optional: enables the Gemini secondary cross-check evaluator. Core
      # grading works with zero API keys via the local autonomous evaluator.
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-3.5-flash}"
      # local | ci | staging | production. Defaults to production, so a missing
      # value is never the one that permits the auth bypass.
      ENVIRONMENT: "${ENVIRONMENT:-production}"
      # Secure by default. Demo mode (no login, every request treated as an
      # anonymous ADMIN) requires AUTH_ENABLED=False AND DEBUG=True AND
      # ENVIRONMENT=local simultaneously; any other combination makes the
      # backend refuse to start. A single stray AUTH_ENABLED: "False" — which
      # is exactly what the merge fixed in a6a1107 appended here — is no longer
      # sufficient to disable authorization on its own.
      AUTH_ENABLED: "${AUTH_ENABLED:-True}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
    volumes:
      - backend_storage:/app/backend/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_storage:
